<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Viva Ticket</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Mercado Pago -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans text-gray-900 min-h-screen flex flex-col justify-between">

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="max-w-4xl mx-auto w-full bg-white p-6 md:p-8 shadow-lg rounded-2xl space-y-8 my-auto">
        
        <!-- CABECERA -->
        <div class="flex justify-between items-center border-b pb-4">
            <h1 class="text-2xl font-black text-amber-500 tracking-wider">VIVA TICKET</h1>
            <a href="index.html" class="text-sm font-semibold text-gray-500 hover:text-amber-600 transition">
                ← Volver al catálogo
            </a>
        </div>

        <!-- RESUMEN DE LA COMPRA -->
        <section class="space-y-4">
            <h2 class="text-xl font-bold text-gray-800">Resumen del Evento Seleccionado</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="border-b border-gray-200 bg-gray-50 text-xs uppercase text-gray-500 font-bold">
                        <tr>
                            <th class="py-3 px-3">Evento</th>
                            <th class="py-3 px-3">Categoría Ticket</th>
                            <th class="py-3 px-3">Precio Unitario</th>
                            <th class="py-3 px-3 text-center">Cantidad</th>
                            <th class="py-3 px-3 text-right">Sub Total</th>
                        </tr>
                    </thead>
                    <tbody id="resumen-body" class="text-sm divide-y divide-gray-100">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- CRONÓMETRO DE RESERVA -->
        <div class="bg-amber-50 border border-amber-200 text-amber-800 p-4 text-center rounded-xl font-bold shadow-sm space-y-1">
            <span id="timer" class="text-3xl font-black block text-amber-600">10:00</span>
            <p class="text-xs font-semibold">Tienes 10 minutos para completar tu compra antes de liberar los cupos del aforo.</p>
        </div>

        <!-- FORMULARIO DATOS DEL COMPRADOR -->
        <section class="space-y-6">
            <h2 class="text-xl font-bold text-gray-800 border-b pb-2">Datos del Comprador</h2>
            
            <form id="form-comprador" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Fecha de Asistencia:</label>
                    <input type="date" id="calendario-funcion" class="border p-3 w-full rounded-xl bg-gray-50 outline-none focus:border-amber-500 font-semibold" required>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Nombre y Apellido:</label>
                    <input type="text" id="comprador-nombre" placeholder="Ej. Ana María Pérez" class="border p-3 w-full rounded-xl outline-none focus:border-amber-500" required>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Celular (WhatsApp):</label>
                    <input type="tel" id="comprador-whatsapp" placeholder="Ej. 912345678" class="border p-3 w-full rounded-xl outline-none focus:border-amber-500" required>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Correo Electrónico:</label>
                    <input type="email" id="comprador-email" placeholder="correo@ejemplo.cl" class="border p-3 w-full rounded-xl outline-none focus:border-amber-500" required>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Confirmar Correo Electrónico:</label>
                    <input type="email" id="comprador-email-confirm" placeholder="Repite tu correo" class="border p-3 w-full rounded-xl outline-none focus:border-amber-500" required>
                </div>
            </form>
        </section>

        <!-- TOTAL Y BOTÓN DE PAGO -->
        <div class="border-t pt-6 flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-50 p-6 rounded-2xl border">
            <div>
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block">Total a Pagar</span>
                <span id="txt-total-checkout" class="text-3xl font-black text-gray-900">$0 CLP</span>
            </div>
            <button onclick="procesarPagoMercadoPago()" class="w-full md:w-auto bg-amber-500 hover:bg-amber-600 text-zinc-950 font-black px-8 py-4 rounded-xl shadow-md transition uppercase tracking-wider text-sm">
                💳 Confirmar y Pagar Entradas
            </button>
        </div>

    </div>

    <!-- SCRIPT DE CONTROL Y CÁLCULOS DINÁMICOS -->
    <script>
        let precioUnitario = 0;
        let eventoData = null;

        try {
            const dataGuardada = localStorage.getItem('evento_seleccionado');
            if (dataGuardada) {
                eventoData = JSON.parse(dataGuardada);
            }
        } catch (e) {
            console.error("Error al leer el evento de localStorage:", e);
        }

        // Si no se encuentra un evento, cargamos datos de respaldo para evitar la pantalla en blanco
        if (!eventoData) {
            eventoData = {
                id: 1,
                titulo: "Taller de Manejo de la Ansiedad",
                direccion: "Av. Santa Isabel 1240 (Providencia)",
                descripcion: "Taller práctico sobre regulación emocional y técnicas de mindfulness.",
                categorias: [{ nombre: "General", precio: 15000 }]
            };
        }

        const body = document.getElementById('resumen-body');
        const catPrincipal = (eventoData.categorias && eventoData.categorias.length > 0) 
            ? eventoData.categorias[0] 
            : { nombre: 'General', precio: 15000 };
        
        precioUnitario = catPrincipal.precio || 15000;

        // Renderizado dinámico de la tabla de resumen
        body.innerHTML = `
            <tr class="hover:bg-gray-50/50 transition">
                <td class="py-4 px-3">
                    <p class="font-bold text-gray-900">${eventoData.titulo}</p>
                    <p class="text-xs text-gray-500">${eventoData.direccion || ''}</p>
                    <p class="text-xs text-gray-400 mt-1 italic line-clamp-1">${eventoData.descripcion || ''}</p>
                </td>
                <td class="py-4 px-3 text-gray-600 font-semibold">${catPrincipal.nombre}</td>
                <td class="py-4 px-3 text-gray-600 font-semibold">$${precioUnitario.toLocaleString('es-CL')}</td>
                
                <td class="py-4 px-3 text-center">
                    <select id="select-cantidad" onchange="actualizarTotales()" class="border border-gray-300 rounded-lg p-2 font-bold text-gray-800 bg-white shadow-sm outline-none focus:border-amber-500 cursor-pointer">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                </td>

                <td class="py-4 px-3 font-bold text-gray-900 text-right" id="txt-subtotal">
                    $${precioUnitario.toLocaleString('es-CL')} CLP
                </td>
            </tr>
        `;

        function actualizarTotales() {
            const select = document.getElementById('select-cantidad');
            const cantidad = parseInt(select ? select.value : 1) || 1;
            const totalCalculado = precioUnitario * cantidad;

            document.getElementById('txt-subtotal').innerText = `$${totalCalculado.toLocaleString('es-CL')} CLP`;
            document.getElementById('txt-total-checkout').innerText = `$${totalCalculado.toLocaleString('es-CL')} CLP`;
        }

        // Configuración de la fecha mínima de asistencia
        const calendario = document.getElementById('calendario-funcion');
        const hoy = new Date();
        const fechaMinima = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;
        if (calendario) {
            calendario.min = fechaMinima;
            calendario.value = fechaMinima;
        }

        // Cronómetro de 10 minutos
        let tiempoRestante = 600;
        const timerSpan = document.getElementById('timer');
        const cuentaRegresiva = setInterval(() => {
            let minutos = Math.floor(tiempoRestante / 60);
            let segundos = tiempoRestante % 60;
            if (timerSpan) {
                timerSpan.textContent = `${minutos}:${segundos < 10 ? '0' : ''}${segundos}`;
            }
            tiempoRestante--;
            if (tiempoRestante < 0) {
                clearInterval(cuentaRegresiva);
                alert("El tiempo de reserva de tus entradas ha expirado.");
                window.location.href = 'index.html';
            }
        }, 1000);

        // Procesar pago
        async function procesarPagoMercadoPago() {
            const nombre = document.getElementById('comprador-nombre').value;
            const email = document.getElementById('comprador-email').value;
            const emailConfirm = document.getElementById('comprador-email-confirm').value;
            const whatsapp = document.getElementById('comprador-whatsapp').value;

            if (!nombre || !email || !whatsapp) {
                return alert("Por favor complete todos los campos del comprador.");
            }
            if (email !== emailConfirm) {
                return alert("Los correos electrónicos ingresados no coinciden.");
            }

            alert(`¡Gracias ${nombre}! Tu reserva de entradas para "${eventoData.titulo}" ha sido registrada exitosamente.`);
        }

        // Calcular totales al cargar la vista
        actualizarTotales();
    </script>
</body>
</html>
