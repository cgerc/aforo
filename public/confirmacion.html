<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra exitosa - ViveTicket</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería para forzar la descarga del PDF directamente en vez de imprimir -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
</head>
<body class="bg-gray-50 min-h-screen p-4 sm:p-8 flex flex-col items-center justify-center">

    <div class="max-w-md w-full space-y-4">
        <!-- Contenedor que se exportará a PDF -->
        <div id="ticket-container" class="bg-white p-6 rounded-2xl shadow border border-gray-100 text-center space-y-4">
            <div class="space-y-1">
                <span class="text-xs font-bold uppercase tracking-wider text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full">Entrada Digital</span>
                <h1 class="text-2xl font-black text-green-600 pt-2">¡Compra procesada con éxito!</h1>
                <p class="text-sm text-gray-500">Tus entradas QR han sido emitidas y enviadas al correo registrado en el pago.</p>
            </div>
            
            <div id="qr-area">
                <!-- Estado de Carga -->
                <div class="p-5 bg-zinc-50 rounded-xl flex flex-col items-center min-h-[220px] justify-center border border-zinc-100">
                    <span id="loading-text" class="text-xs text-gray-400 animate-pulse font-medium">Generando tu entrada QR...</span>
                </div>
            </div>

            <div id="order-badge" class="text-xs text-gray-400 font-mono"></div>
        </div>

        <!-- Botón de Acción -->
        <button id="btn-download" onclick="descargarPDFDirecto()" class="w-full bg-zinc-950 text-white py-3.5 rounded-xl font-bold hover:bg-zinc-800 active:scale-95 transition shadow-md flex items-center justify-center space-x-2">
            <span>📥</span>
            <span id="btn-text">Descargar entrada(s) PDF</span>
        </button>

        <button id="btn-reenviar" onclick="reenviarQR()" class="w-full bg-white text-emerald-700 border border-emerald-200 py-3 rounded-xl font-bold hover:bg-emerald-50 active:scale-95 transition shadow-sm flex items-center justify-center space-x-2">
            <span>📨</span>
            <span id="btn-reenviar-text">Reenviar QR por correo</span>
        </button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('order_id') || params.get('external_reference');

        // Datos del comprador guardados por checkout.html (para el reenvío del QR)
        let compradorGuardado = { nombre: '', email: '' };
        try {
            const guardado = localStorage.getItem('comprador_ticketera');
            if (guardado) compradorGuardado = JSON.parse(guardado);
        } catch (e) { console.warn('No se pudo leer comprador_ticketera:', e); }

        if (orderId) {
            document.getElementById('order-badge').innerText = `Orden #${orderId}`;
        }

        async function obtenerQR() {
            if (!orderId) {
                document.getElementById('loading-text').innerText = 'Error: No se encontró el número de orden.';
                document.getElementById('loading-text').classList.add('text-red-500');
                return;
            }

            try {
                // 1. Confirmación de respaldo por si el Webhook no ha finalizado
                await fetch('/api/orders/confirm-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        order_id: orderId,
                        email: compradorGuardado.email || undefined,
                        nombre_comprador: compradorGuardado.nombre || undefined
                    })
                });

                // 2. Obtener todas las entradas (uno o varios QR por compra)
                const res = await fetch(`/api/orders/${orderId}/entradas`);
                const data = await res.json();
                const entradas = (data && data.entradas) || [];
                const cargando = document.getElementById('loading-text');

                if (entradas.length > 0) {
                    cargando.classList.add('hidden');
                    const area = document.getElementById('qr-area');
                    area.innerHTML = entradas.map((e, i) => renderTarjetaEntrada(e, i + 1, entradas.length)).join('');
                } else if (data.qr_data_url) {
                    cargando.classList.add('hidden');
                    const area = document.getElementById('qr-area');
                    area.innerHTML = renderTarjetaEntrada({ qr_data_url: data.qr_data_url, token: data.qr_token, status: 'PAGADA' }, 1, 1);
                } else {
                    cargando.innerText = 'No se pudo cargar el código QR.';
                    cargando.classList.add('text-red-500');
                }
            } catch (err) {
                console.error('Error procesando QR:', err);
                const cargando = document.getElementById('loading-text');
                cargando.innerText = 'Error al generar el código QR.';
                cargando.classList.add('text-red-500');
            }
        }

        function renderTarjetaEntrada(e, num, total) {
            const usada = e.status === 'USADA';
            const enlaceTicket = e.token
                ? `<a href="/ticket.html?ticket=${encodeURIComponent(e.token)}" target="_blank" class="text-xs text-emerald-600 underline font-semibold">Ver / descargar esta entrada</a>`
                : '';
            return `
                <div class="p-5 bg-zinc-50 rounded-xl flex flex-col items-center border border-zinc-100">
                    <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-full ${usada ? 'text-red-500 bg-red-50' : 'text-emerald-600 bg-emerald-50'}">
                        Entrada ${total > 1 ? num + ' · ' : ''}${usada ? 'Usada' : 'Vigente'}
                    </span>
                    <img src="${e.qr_data_url}" alt="Entrada ${num}" class="w-48 h-48 border bg-white rounded-lg shadow-sm my-3"/>
                    ${enlaceTicket}
                    <button onclick="descargarPNG('${e.qr_data_url}','${num}')" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-bold hover:bg-emerald-500 active:scale-95 transition shadow-sm mt-3 cursor-pointer">
                        🖼️ Descargar imagen QR${total > 1 ? ' ' + num : ''}
                    </button>
                </div>
            `;
        }

        function descargarPNG(dataUrl, num) {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = `Entrada_QR_${orderId || 'orden'}${num ? '_' + num : ''}.png`;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        async function reenviarQR() {
            const btnText = document.getElementById('btn-reenviar-text');
            if (!orderId) return alert('No se encontró la orden.');

            const email = compradorGuardado.email || prompt('Ingresa el correo con el que registraste el pago para reenviar tu QR:');
            if (!email) return;

            btnText.innerText = 'Enviando correo...';
            btnText.parentElement.disabled = true;

            try {
                const res = await fetch(`/api/orders/${orderId}/re-enviar-qr`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, nombre_comprador: compradorGuardado.nombre })
                });
                const data = await res.json();
                if (data.ok) {
                    btnText.innerText = '✓ QR reenviado a tu correo';
                } else {
                    btnText.innerText = data.error || 'No se pudo reenviar. Intenta de nuevo.';
                }
            } catch (err) {
                console.error('Error reenviando QR:', err);
                btnText.innerText = 'Error al reenviar. Intenta de nuevo.';
            }

            setTimeout(() => {
                btnText.innerHTML = '📨 Reenviar QR por correo';
                btnText.parentElement.disabled = false;
            }, 5000);
        }

        async function descargarPDFDirecto() {
            const ticketElement = document.getElementById('ticket-container');
            const btnText = document.getElementById('btn-text');
            const originalText = btnText.innerText;

            btnText.innerText = "Generando archivo PDF...";

            const opciones = {
                margin:       8,
                filename:     `Entrada_ViveTicket_${orderId || 'orden'}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
                jsPDF:        { unit: 'mm', format: 'a5', orientation: 'portrait' }
            };

            try {
                // Genera y dispara la descarga en segundo plano sin abrir ventana de impresión
                await html2pdf().set(opciones).from(ticketElement).save();
            } catch (error) {
                console.error('Error al generar PDF:', error);
            } finally {
                btnText.innerText = originalText;
            }
        }

        obtenerQR();
    </script>
</body>
</html>
