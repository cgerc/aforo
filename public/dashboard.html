<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal Tallerista</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex h-screen">

    <aside class="w-64 bg-zinc-950 text-white p-6 space-y-6">
        <h2 class="text-xl font-black text-amber-500 tracking-wider">SOY TALLERISTA</h2>
        <nav class="space-y-3">
            <a href="#" class="block bg-zinc-800 p-3 rounded font-semibold text-amber-400">📈 Métricas y Precios</a>
            <a href="validador.html" class="block text-gray-300 hover:text-white p-3">📷 Escanear Acceso QR</a>
            <a href="index.html" class="block text-gray-400 hover:text-white p-3">🏠 Regresar</a>
        </nav>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">Administración de Categorías y Aforo</h1>
        
        <div class="bg-white p-6 rounded-xl border mb-6 max-w-xl">
            <h3 class="font-bold text-lg mb-4 text-gray-800">Modificar Precios de Categorías</h3>
            <button onclick="modificarPrecios()" class="bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold px-4 py-2 rounded-lg w-full">
                Configurar Categorías (Niño, Bebé, Adulto mayor)
            </button>
        </div>

        <div class="bg-white p-6 rounded-xl border max-w-3xl">
            <h3 class="font-bold text-lg mb-4">Estado del Aforo (Límite Máximo: 40)</h3>
            <table class="w-full text-left">
                <thead><tr class="text-gray-400 border-b"><th class="pb-2">Taller</th><th class="pb-2">Ventas</th><th class="pb-2">Capacidad</th></tr></thead>
                <tbody id="tabla-aforo"></tbody>
            </table>
        </div>
    </main>

    <script>
        async function cargarDashboard() {
            const res = await fetch('/api/eventos');
            const data = await res.json();
            const tbody = document.getElementById('tabla-aforo');
            tbody.innerHTML = '';
            
            data.forEach(ev => {
                tbody.innerHTML += `<tr class="border-b"><td class="py-3 font-semibold">${ev.titulo}</td><td>${ev.ticketsVendidos} vendidas</td><td>40 Máx</td></tr>`;
            });
        }

        async function modificarPrecios() {
            const normal = prompt("Precio Entrada Normal:", "35000");
            const nino = prompt("Precio Entrada Niño:", "15000");
            const mayor = prompt("Precio Adulto Mayor:", "25000");

            if(!normal || !nino || !mayor) return;

            const nuevasCategorias = [
                { nombre: "Normal", precio: parseFloat(normal) },
                { nombre: "Niño", precio: parseFloat(nino) },
                { nombre: "Bebé", precio: 0 },
                { nombre: "Adulto mayor", precio: parseFloat(mayor) }
            ];

            await fetch('/api/eventos/actualizar-categorias', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ eventoId: 1, nuevasCategorias })
            });
            alert("Precios actualizados en el servidor con éxito.");
            cargarDashboard();
        }
        cargarDashboard();
    </script>
</body>
</html>
