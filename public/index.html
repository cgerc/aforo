<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vive Ticket</title>
    <!-- Tailwind CSS -->
      <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
   
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- NAVBAR DINÁMICA -->
    <nav class="bg-zinc-950 text-white px-6 py-4 flex justify-between items-center sticky top-0 z-[1000]">
        <div class="flex items-center gap-8">
            <span class="text-2xl font-black tracking-wider text-amber-500">VIVE TICKET</span>
            <div class="hidden md:flex bg-zinc-800 rounded-full px-4 py-2 w-80 items-center">
                <input type="text" id="input-buscar-global" placeholder="Buscar eventos, talleres..." class="bg-transparent border-none outline-none text-sm w-full text-gray-300 placeholder-gray-500">
            </div>
        </div>
        
        <div class="flex items-center gap-4 text-sm font-semibold">
            <a href="#" class="hover:text-amber-500 transition hidden sm:inline">Arriendo de espacios</a>
            
            <!-- CONTENEDOR DINÁMICO DE BOTÓN DE SESIÓN -->
            <div id="contenedor-boton-sesion">
                <!-- Se dibuja dinámicamente desde app.js -->
            </div>
        </div>
    </nav>

    <!-- CARRUSEL DESTACADO -->
    <header class="relative w-full h-[500px] bg-zinc-800 overflow-hidden group">
        <div id="carousel-inner" class="relative w-full h-full">
            <div class="absolute inset-0 w-full h-full flex items-center justify-center text-white font-bold">
                Cargando eventos destacados...
            </div>
        </div>

        <button id="prevBtn" class="absolute top-0 left-0 z-20 flex items-center justify-center h-full px-4 cursor-pointer focus:outline-none opacity-50 hover:opacity-100 transition-opacity">
            <span class="inline-flex items-center justify-center w-10 h-10 text-white text-3xl font-light">❮</span>
        </button>

        <button id="nextBtn" class="absolute top-0 right-0 z-20 flex items-center justify-center h-full px-4 cursor-pointer focus:outline-none opacity-50 hover:opacity-100 transition-opacity">
            <span class="inline-flex items-center justify-center w-10 h-10 text-white text-3xl font-light">❯</span>
        </button>
    </header>

    <!-- SECCIONES DE CATEGORÍAS -->
    <main class="max-w-7xl mx-auto px-6 py-12 space-y-16">
        
        <!-- SALUD MENTAL -->
        <section>
            <div class="flex items-center gap-3 mb-8">
                <h2 class="text-3xl md:text-4xl font-black tracking-tight text-zinc-900">Salud mental</h2>
                <span class="text-xs md:text-sm bg-red-500 text-white font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow">Máx 40 cupos</span>
            </div>
            <div id="grid-Salud mental" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
        </section>

        <!-- ENTRETENIMIENTO -->
        <section>
            <div class="flex items-center gap-3 mb-8">
                <h2 class="text-3xl md:text-4xl font-black tracking-tight text-zinc-900">Entretenimiento</h2>
                <span class="text-xs md:text-sm bg-red-500 text-white font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow">Máx 40 cupos</span>
            </div>
            <div id="grid-Entretenimiento" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
        </section>

        <!-- EDUCACIÓN -->
        <section>
            <div class="flex items-center gap-3 mb-8">
                <h2 class="text-3xl md:text-4xl font-black tracking-tight text-zinc-900">Educación</h2>
                <span class="text-xs md:text-sm bg-red-500 text-white font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow">Máx 40 cupos</span>
            </div>
            <div id="grid-Educación" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
        </section>

        <!-- CULTURA -->
        <section>
            <div class="flex items-center gap-3 mb-8">
                <h2 class="text-3xl md:text-4xl font-black tracking-tight text-zinc-900">Cultura</h2>
                <span class="text-xs md:text-sm bg-red-500 text-white font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow">Máx 40 cupos</span>
            </div>
            <div id="grid-Cultura" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
        </section>

    </main>

    <!-- MAPA -->
    <section class="bg-zinc-900 text-white py-12 px-6">
        <div class="max-w-7xl mx-auto space-y-8">
            <div class="text-center space-y-4">
                <h2 class="text-3xl font-black text-white">Busca evento por fecha o comuna</h2>
                <p class="text-gray-400 text-sm">Filtra la disponibilidad de los talleres en el mapa e interactúa con sus ubicaciones.</p>
            </div>

            <!-- BARRA DE FILTROS -->
            <div class="bg-zinc-800 p-4 rounded-2xl border border-zinc-700 flex flex-col md:flex-row gap-4 items-center justify-between shadow-xl">
                <div class="w-full md:w-1/2 flex items-center gap-3 bg-zinc-900 px-4 py-3 rounded-xl border border-zinc-700">
                    <span class="text-lg">📍</span>
                    <div class="w-full">
                        <label class="block text-[10px] font-bold uppercase text-amber-500 tracking-wider">Seleccionar Comuna</label>
                        <select id="filtro-comuna" onchange="aplicarFiltrosBusqueda()" class="w-full bg-transparent text-white font-semibold outline-none text-sm cursor-pointer">
                            <option value="todas" class="bg-zinc-900 text-white">Todas las comunas</option>
                            <option value="providencia" class="bg-zinc-900 text-white">Providencia</option>
                            <option value="ñuñoa" class="bg-zinc-900 text-white">Ñuñoa</option>
                            <option value="las condes" class="bg-zinc-900 text-white">Las Condes</option>
                            <option value="la reina" class="bg-zinc-900 text-white">La Reina</option>
                            <option value="vitacura" class="bg-zinc-900 text-white">Vitacura</option>
                            <option value="lo barnechea" class="bg-zinc-900 text-white">Lo Barnechea</option>
                        </select>
                    </div>
                </div>

                <div class="w-full md:w-1/2 flex items-center gap-3 bg-zinc-900 px-4 py-3 rounded-xl border border-zinc-700">
                    <span class="text-lg">📅</span>
                    <div class="w-full">
                        <label class="block text-[10px] font-bold uppercase text-amber-500 tracking-wider">Buscar por Fecha</label>
                        <input type="date" id="filtro-fecha" onchange="aplicarFiltrosBusqueda()" class="w-full bg-transparent text-white font-semibold outline-none text-sm cursor-pointer">
                    </div>
                </div>

                <button onclick="limpiarFiltrosBusqueda()" class="w-full md:w-auto bg-amber-500 hover:bg-amber-600 text-zinc-950 font-black px-6 py-3.5 rounded-xl transition text-xs uppercase tracking-wider whitespace-nowrap cursor-pointer">
                    🔄 Limpiar Filtros
                </button>
            </div>

            <div id="mapa" class="w-full h-[550px] rounded-2xl overflow-hidden border-4 border-zinc-800 shadow-2xl"></div>
        </div>
    </section>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
