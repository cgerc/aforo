<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Organizadores - Vive Ticket</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white flex items-center justify-center min-h-screen px-4 font-sans">

    <div class="bg-[#18181b] border border-zinc-800 p-8 rounded-2xl w-full max-w-xl shadow-2xl space-y-6">
        
        <!-- ENCABEZADO DE LA PLATAFORMA -->
        <div class="text-center">
            <span class="text-3xl font-black tracking-wider text-amber-500">VIVE TICKET</span>
            <p id="form-subtitle" class="text-zinc-400 text-sm mt-2">Ingresa al portal de organizadores</p>
        </div>

        <!-- FORMULARIO PRINCIPAL -->
        <form id="auth-form" class="space-y-4" novalidate>
            
            <!-- VISTA A: FORMULARIO DE INICIO DE SESIÓN (LOGIN) -->
            <div id="login-fields" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 font-bold uppercase mb-1 px-1">Correo Electrónico</label>
                    <input type="email" id="login-email" class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-full p-3.5 text-white outline-none focus:border-amber-500 transition px-5">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 font-bold uppercase mb-1 px-1">Contraseña</label>
                    <input type="password" id="login-password" class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-full p-3.5 text-white outline-none focus:border-amber-500 transition px-5">
                </div>
            </div>

            <!-- VISTA B: PASO 1 - DATOS PERSONALES -->
            <div id="step-personal-fields" class="space-y-4 hidden">
                <h3 class="text-xl font-bold mb-2 text-zinc-200">Datos personales</h3>
                <input type="text" id="reg-nombre" placeholder="Nombre *" class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-full p-3.5 px-5 text-white outline-none focus:border-amber-500 transition">
                <input type="text" id="reg-apellido" placeholder="Apellido *" class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-full p-3.5 px-5 text-white outline-none focus:border-amber-500 transition">
                <input type="text" id="reg-empresa" placeholder="Empresa/Productora *" class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-full p-3.5 px-5 text-white outline-none focus:border-amber-500 transition">
                <input type="email" id="reg-email" placeholder="Correo Electrónico *" class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-full p-3.5 px-5 text-white outline-none focus:border-amber-500 transition">
                <input type="password" id="reg-password" placeholder="Contraseña de la cuenta *" class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-full p-3.5 px-5 text-white outline-none focus:border-amber-500 transition">
                <input type="text" id="reg-telefono" value="+569" placeholder="+569" class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-full p-3.5 px-5 text-white outline-none focus:border-amber-500 transition">
            </div>

            <!-- VISTA C: PASO 2 - DATOS DE TU EVENTO -->
            <div id="step-event-fields" class="space-y-4 hidden">
                <h3 class="text-xl font-bold mb-2 text-zinc-200">Datos de tu evento</h3>
                <input type="text" id="event-nombre" placeholder="Nombre de evento *" class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-full p-3.5 px-5 text-white outline-none focus:border-amber-500 transition">
                
                <select id="event-categoria" class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-full p-3.5 px-5 text-white outline-none focus:border-amber-500 transition appearance-none">
                    <option value="" disabled selected>Selecciona una categoría *</option>
                    <option value="salud mental">Salud Mental</option>
                    <option value="entretenimiento">Entretenimiento</option>
                    <option value="educación">Educación</option>
                    <option value="cultura">Cultura</option>
                </select>

                <div class="grid grid-cols-2 gap-4">
                    <input type="date" id="event-fecha" class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-full p-3.5 px-5 text-white outline-none focus:border-amber-500 transition">
                    <input type="time" id="event-hora" class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-full p-3.5 px-5 text-white outline-none focus:border-amber-500 transition">
                </div>

                <input type="text" id="event-lugar" placeholder="Lugar o Dirección (Ej: Providencia 1200) *" class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-full p-3.5 px-5 text-white outline-none focus:border-amber-500 transition">
                <textarea id="event-mensaje" placeholder="Descripción del evento" rows="4" class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-2xl p-3.5 px-5 text-white outline-none focus:border-amber-500 transition resize-none"></textarea>
            </div>

            <!-- VISTA D: VERIFICACIÓN DE CÓDIGO -->
            <div id="step-verify-fields" class="space-y-4 hidden">
                <h3 class="text-xl font-bold mb-2 text-zinc-200">Verifica tu correo</h3>
                <p class="text-sm text-zinc-400">Ingresa el código de 6 dígitos enviado a tu correo.</p>
                <input type="text" id="verify-code" inputmode="numeric" maxlength="6" placeholder="Código de verificación" class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-full p-3.5 px-5 text-white outline-none focus:border-amber-500 transition text-center text-lg font-mono tracking-widest">
                
                <!-- BOTÓN PARA REENVIAR CÓDIGO -->
                <div class="text-center pt-1">
                    <button type="button" id="btn-resend-code" class="text-xs text-amber-500 hover:underline font-semibold">
                        ¿No recibiste el código? Solicitar uno nuevo
                    </button>
                </div>
            </div>
            
            <!-- Mensajes del Servidor -->
            <div id="error-message" class="text-red-500 text-xs font-bold hidden text-center"></div>
            <div id="success-message" class="text-green-500 text-xs font-bold hidden text-center"></div>
            
            <!-- BOTÓN PRINCIPAL DE ACCIÓN -->
            <div class="flex justify-center pt-2">
                <button type="submit" id="btn-submit" class="w-full sm:w-auto min-w-[160px] bg-zinc-300 text-zinc-900 hover:bg-white font-bold py-3 px-8 rounded-full uppercase tracking-wider text-sm transition-all shadow-md">
                    Siguiente
                </button>
            </div>
        </form>

        <!-- SECCIÓN DE ENLACES INFERIORES -->
        <div class="flex flex-col gap-3 pt-2 text-center text-sm border-t border-zinc-800/60">
            <div class="flex justify-between items-center px-2">
                <button id="btn-toggle-mode" type="button" class="text-amber-500 hover:underline text-xs font-bold uppercase tracking-wider">
                    ¿No tienes cuenta? Crear Cuenta
                </button>
                <button id="btn-forgot" type="button" class="text-zinc-400 hover:text-white text-xs font-medium">
                    Olvidé mi contraseña
                </button>
            </div>
        </div>
    </div>

    <!-- CONTROLADOR DE LA LÓGICA E INTERFAZ -->
    <script>
        if (localStorage.getItem('token_ticketera')) {
            window.location.replace('dashboard.html');
        }

        const form = document.getElementById('auth-form');
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');
        
        const loginFields = document.getElementById('login-fields');
        const stepPersonalFields = document.getElementById('step-personal-fields');
        const stepEventFields = document.getElementById('step-event-fields');
        const stepVerifyFields = document.getElementById('step-verify-fields');
        
        const btnSubmit = document.getElementById('btn-submit');
        const btnToggleMode = document.getElementById('btn-toggle-mode');
        const btnForgot = document.getElementById('btn-forgot');
        const btnResendCode = document.getElementById('btn-resend-code');
        const subtitle = document.getElementById('form-subtitle');

        let currentMode = 'login';
        let pendingEmail = '';

        // Cambiar entre Modos
        btnToggleMode.addEventListener('click', () => {
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            
            if (currentMode === 'login') {
                setMode('reg-step1');
            } else if (currentMode === 'reg-step2') {
                setMode('reg-step1');
            } else {
                setMode('login');
            }
        });

        function setMode(mode) {
            currentMode = mode;
            errorDiv.classList.add('hidden');

            loginFields.classList.add('hidden');
            stepPersonalFields.classList.add('hidden');
            stepEventFields.classList.add('hidden');
            stepVerifyFields.classList.add('hidden');
            btnForgot.classList.remove('invisible');

            if (mode === 'login') {
                subtitle.innerText = 'Ingresa al portal de organizadores';
                loginFields.classList.remove('hidden');
                btnSubmit.innerText = 'Ingresar';
                btnToggleMode.innerText = '¿No tienes cuenta? Crear Cuenta';
            } 
            else if (mode === 'reg-step1') {
                subtitle.innerText = 'Crea tu cuenta de Productor / Tallerista';
                stepPersonalFields.classList.remove('hidden');
                btnSubmit.innerText = 'Siguiente';
                btnToggleMode.innerText = '¿Ya tienes cuenta? Ingresar';
                btnForgot.classList.add('invisible');
            } 
            else if (mode === 'reg-step2') {
                subtitle.innerText = 'Cuéntanos sobre tu primer evento';
                stepEventFields.classList.remove('hidden');
                btnSubmit.innerText = 'Finalizar Registro';
                btnToggleMode.innerText = '← Volver al paso anterior';
                btnForgot.classList.add('invisible');
            } else if (mode === 'reg-verify') {
                subtitle.innerText = 'Confirma tu correo electrónico';
                stepVerifyFields.classList.remove('hidden');
                btnSubmit.innerText = 'Verificar correo';
                btnToggleMode.innerText = '¿Ya tienes cuenta? Ingresar';
                btnForgot.classList.add('invisible');
            }
        }

        // Reenviar código de verificación
        btnResendCode.addEventListener('click', async () => {
            if (!pendingEmail) {
                showError('No hay un correo registrado para reenviar el código.');
                return;
            }
            executeAuth('/api/auth/resend-code', { email: pendingEmail }, false, false, true);
        });

        // Olvidé mi Contraseña
        btnForgot.addEventListener('click', () => {
            errorDiv.classList.add('hidden');
            successDiv.classList.remove('hidden');
            successDiv.innerText = 'Se envió un enlace para reestablecer la clave a tu correo.';
        });

        // Submit del Formulario
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            if (currentMode === 'login') {
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;

                if (!email || !password) {
                    showError('Por favor completa las credenciales.');
                    return;
                }

                pendingEmail = email; // Se guarda para ser usado si requiere verificación
                executeAuth('/api/auth/login', { email, password }, true);
            } 
            else if (currentMode === 'reg-step1') {
                const nombre = document.getElementById('reg-nombre').value.trim();
                const apellido = document.getElementById('reg-apellido').value.trim();
                const empresa = document.getElementById('reg-empresa').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const password = document.getElementById('reg-password').value;

                if (!nombre || !apellido || !empresa || !password || !email) {
                    showError('Por favor rellena todos los campos obligatorios (*).');
                    return;
                }

                if (password.length < 6) {
                    showError('La contraseña debe tener al menos 6 caracteres.');
                    return;
                }

                setMode('reg-step2');
            } 
            else if (currentMode === 'reg-step2') {
                const eventNombre = document.getElementById('event-nombre').value.trim();
                const eventCategoria = document.getElementById('event-categoria').value;
                const eventLugar = document.getElementById('event-lugar').value.trim();

                if (!eventNombre || !eventCategoria || !eventLugar) {
                    showError('El nombre, la categoría y el lugar del evento son requeridos.');
                    return;
                }

                const payload = {
                    nombre: document.getElementById('reg-nombre').value.trim(),
                    apellido: document.getElementById('reg-apellido').value.trim(),
                    empresa: document.getElementById('reg-empresa').value.trim(),
                    email: document.getElementById('reg-email').value.trim(),
                    password: document.getElementById('reg-password').value,
                    telefono: document.getElementById('reg-telefono').value.trim(),
                    evento: {
                        titulo: eventNombre,
                        categoria: eventCategoria,
                        fecha: document.getElementById('event-fecha').value,
                        hora: document.getElementById('event-hora').value,
                        lugar: eventLugar,
                        mensaje: document.getElementById('event-mensaje').value.trim()
                    }
                };

                executeAuth('/api/auth/register', payload, false);
            } 
            else if (currentMode === 'reg-verify') {
                const codigo = document.getElementById('verify-code').value.trim();
                if (!/^\d{6}$/.test(codigo)) {
                    showError('Ingresa el código de 6 dígitos recibido por correo.');
                    return;
                }
                executeAuth('/api/auth/verify-email', { email: pendingEmail, codigo }, false, true);
            }
        });

        // FUNCION DE AUTENTICACIÓN
        async function executeAuth(url, bodyData, isLogin, isVerification = false, isResend = false) {
            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-50');

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error(`El servidor no respondió en JSON (${response.status}). Revisa que la ruta ${url} esté declarada en server.js.`);
                }

                const data = await response.json();

                if (!response.ok) {
                    // MEJORA: Detecta si el error de login es por falta de verificación de correo
                    if (isLogin && (response.status === 403 || data.error?.toLowerCase().includes('verific'))) {
                        successDiv.innerText = 'Tu cuenta aún no está verificada. Ingresa el código recibido.';
                        successDiv.classList.remove('hidden');
                        setMode('reg-verify');
                        return;
                    }
                    throw new Error(data.error || 'Ocurrió un error en el sistema.');
                }

                if (isLogin) {
                    localStorage.setItem('token_ticketera', data.token);
                    localStorage.setItem('usuario_autenticado', 'true');
                    localStorage.setItem('usuario_ticketera', JSON.stringify(data.usuario));
                    window.location.href = 'dashboard.html';
                } else if (isVerification) {
                    successDiv.innerText = '¡Correo verificado con éxito! Ya puedes iniciar sesión.';
                    successDiv.classList.remove('hidden');
                    setMode('login');
                    form.reset();
                } else if (isResend) {
                    successDiv.innerText = 'Se ha reexpedido un nuevo código a tu correo.';
                    successDiv.classList.remove('hidden');
                } else {
                    pendingEmail = bodyData.email;
                    successDiv.innerText = data.modo === 'local'
                        ? 'Modo local: revisa la consola del servidor para obtener el código.'
                        : 'Te enviamos un código de verificación a tu correo.';
                    successDiv.classList.remove('hidden');
                    setMode('reg-verify');
                }
            } catch (err) {
                showError(err.message);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-50');
            }
        }

        function showError(msg) {
            errorDiv.innerText = msg;
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
