<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escanear entrada QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-zinc-900 text-white min-h-screen flex flex-col justify-between p-6">

    <header class="text-center py-2 border-b border-zinc-800">
        <h1 class="text-lg font-black text-amber-500">VALIDADOR PORTÁTIL</h1>
        <p id="taller-info" class="text-xs text-gray-400 mt-1">Cargando evento...</p>
    </header>

    <main class="max-w-md mx-auto w-full space-y-4 my-auto">
        <!-- Lector QR -->
        <div id="reader" class="w-full bg-zinc-950 rounded-xl overflow-hidden border border-zinc-700"></div>
        
        <!-- Mensaje de Feedback -->
        <div id="feedback" class="hidden p-4 rounded-lg text-center font-bold"></div>

        <!-- Botón para siguiente escaneo -->
        <button id="btn-restart" onclick="reiniciarEscaneo()" class="hidden w-full bg-amber-500 text-zinc-950 py-3 rounded-lg font-bold hover:bg-amber-400 transition">
            Escanear siguiente entrada
        </button>
    </main>

    <footer class="text-center text-xs text-gray-500">
        <a href="dashboard.html" class="underline text-amber-500">Volver al Panel</a>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const tallerId = params.get('taller_id');

        const tallerInfo = document.getElementById('taller-info');
        const box = document.getElementById('feedback');
        const btnRestart = document.getElementById('btn-restart');

        let scanner = null;
        let procesando = false;

        if (!tallerId) {
            tallerInfo.innerText = "⚠️ Error: Falta el parámetro taller_id en el enlace.";
            tallerInfo.classList.add("text-red-400");
        } else {
            tallerInfo.innerText = `Validando Evento ID: ${tallerId}`;
            iniciarScanner();
        }

        function iniciarScanner() {
            procesando = false;
            box.classList.add('hidden');
            btnRestart.classList.add('hidden');

            scanner = new Html5QrcodeScanner("reader", { 
                fps: 10, 
                qrbox: 250 
            }, false);

            scanner.render(onScanSuccess);
        }

        async function onScanSuccess(decodedText) {
            if (procesando) return;
            procesando = true;

            // Pausar la cámara mientras se hace la consulta
            if (scanner) {
                await scanner.clear().catch(err => console.error("Error al pausar la cámara:", err));
            }

            box.className = "p-4 rounded-lg text-center font-bold bg-zinc-800 text-amber-400 border border-amber-500/50";
            box.innerText = "Validando entrada...";
            box.classList.remove('hidden');

            try {
                const res = await fetch('/api/validador/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        qr_token: decodedText,
                        taller_id_actual: tallerId
                    })
                });

                const data = await res.json();
                
                if (res.ok && data.valid) {
                    box.className = "p-4 rounded-lg text-center font-bold bg-green-900 text-green-200 border border-green-600";
                    box.innerHTML = `✅ ${data.message}<br><span class='text-xs font-normal'>Orden #${data.order_id}</span>`;
                } else if (res.status === 409) {
                    box.className = "p-4 rounded-lg text-center font-bold bg-amber-900 text-amber-200 border border-amber-600";
                    box.innerText = `🚨 ${data.message}`;
                } else {
                    box.className = "p-4 rounded-lg text-center font-bold bg-red-900 text-red-200 border border-red-600";
                    box.innerText = `❌ ${data.message}`;
                }
            } catch (error) {
                console.error("Error validando QR:", error);
                box.className = "p-4 rounded-lg text-center font-bold bg-red-900 text-red-200 border border-red-600";
                box.innerText = "❌ Error de conexión al servidor.";
            }

            btnRestart.classList.remove('hidden');
        }

        function reiniciarEscaneo() {
            iniciarScanner();
        }
    </script>
</body>
</html>
